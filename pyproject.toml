[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-observability"
version = "0.1.0"
description = "Unified LLM Observability Package for Phoenix + OpenTelemetry"
authors = [{ name = "Vinay Vattipally", email = "vinay.vattipally@sparity.com" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["observability", "phoenix", "opentelemetry", "llm", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp>=1.25,<2.0",
    "python-dotenv>=1.0.0,<2.0",
    "psutil>=5.9.5,<6.0",
]

[project.optional-dependencies]
phoenix = [
    "arize-phoenix>=2.5.0",
]
toxicity = [
    "openai>=1.0.0",
    "requests>=2.31.0",
]
validation = [
    "pydantic>=2.0.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.21.0",
    "coverage>=7.3.0",
]
lint = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-psutil>=5.9.0",
    "types-python-dotenv>=1.0.0",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.23.0",
]
all = [
    "arize-phoenix>=2.5.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/VinayVattipally-sparity/phoenix-observability"
Documentation = "https://github.com/VinayVattipally-sparity/phoenix-observability#readme"
Repository = "https://github.com/VinayVattipally-sparity/phoenix-observability"

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=phoenix_observability",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "-v",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["phoenix_observability"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
# Ruff configuration (see ruff.toml for full config)
line-length = 100
target-version = "py39"

[tool.mypy]
# MyPy configuration (see mypy.ini for full config)
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

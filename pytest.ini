[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=phoenix_observability
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
    -v
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning


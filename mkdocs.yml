site_name: Phoenix Observability
site_description: Unified LLM Observability Package for Phoenix + OpenTelemetry
site_author: Vinay Vattipally
repo_url: https://github.com/VinayVattipally-sparity/phoenix-observability
repo_name: phoenix-observability

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [phoenix_observability]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_if_no_docstring: false
            separate_signature: true
            heading_level: 2
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - LLM Instrumentation: user-guide/llm-instrumentation.md
    - RAG Instrumentation: user-guide/rag-instrumentation.md
    - Agent Instrumentation: user-guide/agent-instrumentation.md
    - Pipeline Instrumentation: user-guide/pipeline-instrumentation.md
  - API Reference:
    - Core:
      - config: api/core/config.md
      - otel_setup: api/core/otel_setup.md
    - Instrumentation:
      - llm_wrapper: api/instrumentation/llm_wrapper.md
      - rag_wrapper: api/instrumentation/rag_wrapper.md
      - agent_wrapper: api/instrumentation/agent_wrapper.md
      - pipeline_wrapper: api/instrumentation/pipeline_wrapper.md
    - Utilities:
      - cost_tracker: api/utils/cost_tracker.md
      - rate_limiter: api/utils/rate_limiter.md
      - http_client: api/utils/http_client.md
      - sanitize: api/utils/sanitize.md
      - security: api/utils/security.md
  - Architecture: architecture.md
  - Examples: examples.md
  - Security: security.md
  - Changelog: CHANGELOG.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

